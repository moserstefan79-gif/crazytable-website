<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="Intermezzo – crazytable">
  <defs>
    <style>
      .word{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:104px;letter-spacing:-0.02em;fill:#FFFFFF}
      .tag{font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:0.3em;fill:#3EAFC8}
    </style>
    <clipPath id="bowl"><path d="M-34 0 H34 C34 44 18 66 0 70 C-18 66 -34 44 -34 0 Z"/></clipPath>
  </defs>
  <!-- Pausezeichen: zwei Balken, dazwischen ein Glas – das Intermezzo -->
  <g transform="translate(22 34)">
    <rect x="0" y="0" width="14" height="132" fill="#FFFFFF"/>
    <rect x="118" y="0" width="14" height="132" fill="#FFFFFF"/>
    <g transform="translate(66 8)">
      <rect x="-40" y="30" width="80" height="50" fill="#3EAFC8" clip-path="url(#bowl)"/>
      <path d="M-34 0 H34 C34 44 18 66 0 70 C-18 66 -34 44 -34 0 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-3" y="70" width="6" height="34" fill="#FFFFFF"/>
      <rect x="-24" y="104" width="48" height="6" rx="1" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="178" y="122" class="word">Intermezzo</text>
  <text x="182" y="158" class="tag">EINE FLASCHE · EIN MITTWOCH · ATIKA ZUCHWIL</text>
</svg>
